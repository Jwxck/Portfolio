<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructures & Security | Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           VARIABLES ET THÈME DE COULEURS
           ============================================
        */
        :root {
            --bg-deep: #0F172A;       /* Bleu très sombre pour le fond */
            --cyber-blue: #3B82F6;    /* Bleu vif pour les éléments primaires */
            --cyber-green: #10B981;   /* Vert pour les indicateurs de succès/sécurité */
            --glass-border: rgba(59, 130, 246, 0.2); /* Bordure translucide pour l'effet verre */
        }

        body {
            background-color: var(--bg-deep);
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Police à chasse fixe pour renforcer l'aspect technique/informatique */
        .font-mono { font-family: 'Fira Code', monospace; }
        
        /* ============================================
           COMPOSANTS UI (Cyber / Glassmorphism)
           ============================================
        */

        /* Navigation effet de verre (flou d'arrière-plan) */
        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Cartes interactives avec effet de lueur (glow) au survol */
        .cyber-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-card:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
            transform: translateY(-4px); /* Petit saut vers le haut */
        }

        /* Effets de texte lumineux */
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .glow-green { text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        /* ============================================
           ANIMATIONS
           ============================================
        */

        /* Ligne de scan qui descend le long de l'écran (effet vieux moniteur) */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.05), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        /* Transition d'apparition douce pour les sections SPA */
        .view-transition { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Curseur clignotant pour l'effet "machine à écrire" */
        .typing-cursor::after {
            content: "|";
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Personnalisation de la barre de défilement (scrollbar) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyber-blue); }
    </style>
</head>
<body class="antialiased scanline">

    <nav class="fixed top-0 w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3 group cursor-pointer" onclick="app.navigate('home')">

                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <span class="font-mono font-bold text-xl tracking-tighter uppercase">root<span class="text-blue-500">@</span>127.0.0.1</span>
                </div>
                
                <div class="hidden md:flex items-center space-x-1 font-mono text-sm">
                    <button onclick="app.navigate('home')" class="px-4 py-2 text-slate-400 hover:text-blue-400 transition-all">~/Home</button>
                    <button onclick="app.navigate('experience')" class="px-4 py-2 text-slate-400 hover:text-blue-400 transition-all">~/Logs</button>
                    <button onclick="app.navigate('projects')" class="px-4 py-2 text-slate-400 hover:text-blue-400 transition-all">~/Deploiement</button>
                    <button onclick="app.navigate('contact')" class="ml-4 px-5 py-2 bg-blue-600/10 border border-blue-500/50 text-blue-400 rounded hover:bg-blue-600/20 transition-all">Contact</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-content" class="pt-32 pb-20 px-6 max-w-7xl mx-auto">

                    </div>
                    <h1 class="text-5xl md:text-7xl font-bold leading-tight">

                    </h1>
                    <p id="hero-bio" class="text-slate-400 text-lg max-w-xl leading-relaxed border-l-2 border-slate-800 pl-6 italic"></p>
                    
                    <div class="flex flex-wrap gap-4 pt-4">
                        <button onclick="app.navigate('projects')" class="px-8 py-4 bg-blue-600 text-white font-mono font-bold rounded shadow-lg shadow-blue-900/20 hover:bg-blue-500 transition-all">RUN_INFRA_AUDIT</button>
                        <div class="flex items-center gap-4 px-6">
                            <a id="hero-github" target="_blank" class="text-slate-500 hover:text-white transition-colors">GitHub</a>
                            <a id="hero-linkedin" target="_blank" class="text-slate-500 hover:text-white transition-colors">LinkedIn</a>
                        </div>
                    </div>
                </div>
                <div class="relative hidden lg:block">

                    <div class="relative bg-slate-900 border border-slate-700 rounded-lg p-2 shadow-2xl overflow-hidden">
                        <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-950/50">
                            <div class="flex gap-1.5">
                                <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                                <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
                            </div>

                        </div>
                        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=800" alt="Cyber Security" class="w-full grayscale hover:grayscale-0 transition-all duration-700">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="skills-container"></div>
        </section>

        <section id="view-experience" class="view hidden view-transition max-w-4xl mx-auto">
            <div class="mb-12">
                <h2 class="text-3xl font-bold font-mono text-blue-400 mb-2">>sudo journalctl -u career.service</h2>
                <div class="h-1 w-20 bg-blue-500/30"></div>
            </div>
            <div id="experience-timeline" class="space-y-12 border-l-2 border-slate-800 ml-4"></div>
        </section>

        <section id="view-projects" class="view hidden view-transition">

                    <h2 class="text-3xl font-bold font-mono text-blue-400 mb-2">> ls /dev/deployments</h2>
                    <p class="text-slate-500 font-mono text-sm">Infrastructure-as-Code & Security projects portfolio</p>
                </div>
            </div>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <section id="view-contact" class="view hidden view-transition max-w-2xl mx-auto">

                    <h2 class="text-3xl font-bold font-mono text-blue-400 mb-4">TCP_HANDSHAKE</h2>
                    <p class="text-slate-400">Initiate a secure connection for collaborations or inquiries.</p>
                </div>
                <form id="contact-form" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="space-y-2">

                        <div class="space-y-2">

                        </div>

                    <div class="space-y-2">
                        <label class="font-mono text-xs text-blue-400 uppercase tracking-widest">Data_Payload</label>
                        <textarea rows="5" placeholder="Enter message..." class="w-full bg-slate-950 border border-slate-800 rounded px-4 py-3 focus:border-blue-500 focus:outline-none transition-all" required></textarea>
                    </div>
                    <button type="submit" class="w-full py-4 bg-blue-600/10 border border-blue-500 text-blue-400 font-mono font-bold rounded hover:bg-blue-600 hover:text-white transition-all">
                        SEND_PACKET
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-800/50 py-10 mt-20">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="font-mono text-xs text-slate-500 uppercase tracking-tighter" id="footer-copy"></div>
            <div id="footer-socials" class="flex gap-6"></div>
        </div>
    </footer>

    <div id="project-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/95 backdrop-blur-md" onclick="app.closeModal()"></div>
        
        <div class="relative bg-slate-900 border border-slate-700 w-full max-w-5xl max-h-[90vh] rounded-lg overflow-y-auto shadow-2xl">
            <div class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="font-mono text-sm text-slate-300">PROJECT_DETAIL_VIEW</span>
                </div>
                <button onclick="app.closeModal()" class="text-slate-500 hover:text-white text-2xl font-mono transition-colors">&times;</button>
            </div>
            
            <div id="modal-content" class="p-8"></div>
            
            <div class="sticky bottom-0 bg-slate-900/90 border-t border-slate-800 p-4 flex justify-between">
                <button onclick="app.navigateModal(-1)" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 rounded font-mono text-sm transition-all">< PREV</button>
                <button onclick="app.navigateModal(1)" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 rounded font-mono text-sm transition-all">NEXT ></button>
            </div>
        </div>
    </div>

    <script>
        /**
         * adminData : Objet central stockant toutes les données du portfolio.
         * Modifier cet objet permet de mettre à jour le contenu sans toucher au HTML.
         */
        const adminData = {
            profile: {
                firstName: "Maxence",
                lastName: "ARRAULT",
                role: "Junior Admin Sys Res",
                bio: "Spécialiste en administration d'infrastructure réseau. Je fais des schémas réseaux, les mets en place, configure et organise toute l'infrastructure qui va derrière serveurs, routeurs, machines clientes, etc...",
                socials: {
                    github: "https://github.com/Jwxck/",
                    linkedin: "https://www.linkedin.com/in/maxence-arrault-b3799b32b/",
                    twitter: "https://youtube.com"
                }
            },
            /* Pour ajouter une compétence : rajouter une ligne dans 'items' de la catégorie correspondante */
            skills: [
                { category: "Infrastructure", items: ["Linux Server (deb,ubuntu,alma...)", "Proxmox", "Kubernetes", "Ansible"] },
                { category: "Cybersecurity", items: ["Sécurité server", "Networking"] },
                { category: "Networking", items: ["Routing", "Networking", "Firewalling", "WAN/LAN"] },
                { category: "Server", items: ["AD DS ", "DHCP", "Docker", "DNS"] },
                { category: "Scripting", items: ["Python", "PHP", "PowerShell", "HTML/CSS"] }
            ],
            /* Pour ajouter une expérience : rajouter un bloc {} dans le tableau */
            experience: [
                {
                    id: 1,
                    period: "Janvier 2025 — Février 2026",
                    role: "Consultant informatique",
                    company: "SII Groupe",
                    details: "Masterisation de postes de travail sous Windows 10,11/Linux/MACOS. Support de niveau 1/2 pour les utilisateurs finaux. "
                },
                {
                    id: 2,
                    period: "2023 — 2025",
                    role: "Technicien support informatique",
                    company: "Direction Technique - Groupe La Poste",
                    details: "Gestion des incidents et demandes de service pour les collaborateurs. Maintenance préventive et corrective des équipements informatiques. Participation à des projets d'amélioration de l'infrastructure IT."
                }
            ],
            /* Pour ajouter un projet : copier-coller un bloc {} existant */
            projects: [
                {
                    id: 0,
                    title: "VPN Site à Client",
                    shortDesc: "Mise en place d'un VPN sécurisé StoC",
                    image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc51?auto=format&fit=crop&q=80&w=800",
                    fullDesc: "Mise en place d'un VPN pour un accès distant au site par un client. Plus gestion des permissions en fonction du client",
                    problem: "Aucun VPN mis en place, l'accès ne se faisait qu'en local",
                    solution: "Déploiement d'un VPN sécurisé avec Wireguard et Tailscale.",
                    techs: ["Tailscale", "Wireguard",],
                    link: "SOON"
                },

            ]
        };

        /**
         * app : Module principal contenant la logique du site (Navigation, Rendu, Modale)
         */
        const app = {
            currentProjectIndex: 0, // Stocke l'index du projet actuellement vu dans la modale

            /**
             * init() : Point d'entrée de l'application au chargement
             */
            init() {
                this.renderStatic();     // Injecte nom, bio, footer
                this.renderSkills();     // Génère les cartes de compétences
                this.renderExperience(); // Génère la timeline
                this.renderProjects();   // Génère la grille de projets
                this.initTyping();       // Lance l'animation de titre
                this.handleForms();      // Configure les écouteurs de formulaires
            },

            /**
             * renderStatic() : Remplit les éléments HTML fixes avec les données de profil
             */
            renderStatic() {
                const p = adminData.profile;
                document.getElementById('hero-name').innerText = `${p.firstName} ${p.lastName}`;
                document.getElementById('hero-bio').innerText = p.bio;
                document.getElementById('hero-github').href = p.socials.github;
                document.getElementById('hero-linkedin').href = p.socials.linkedin;
                document.getElementById('footer-copy').innerText = `© ${new Date().getFullYear()} ${p.lastName}_INFRA_CORE_SYSTEM`;
                
                // Génération dynamique des liens sociaux du footer
                const socialFooter = document.getElementById('footer-socials');
                Object.entries(p.socials).forEach(([key, url]) => {
                    socialFooter.innerHTML += `<a href="${url}" target="_blank" class="text-slate-500 hover:text-blue-400 font-mono text-xs transition-colors uppercase">${key}</a>`;
                });
            },

            /**
             * initTyping() : Effet de machine à écrire sur le rôle professionnel
             */
            initTyping() {
                const target = document.getElementById('hero-role');
                const text = adminData.profile.role;
                let i = 0;
                function type() {
                    if (i < text.length) {
                        target.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, 50); // Vitesse de frappe (ms)
                    }
                }
                setTimeout(type, 1000); // Délai avant lancement (1s)
            },

            /**
             * renderSkills() : Parcourt adminData.skills pour créer les cartes techniques
             */
            renderSkills() {
                const container = document.getElementById('skills-container');
                adminData.skills.forEach(cat => {
                    const skillList = cat.items.map(s => `<li class="text-sm text-slate-400 flex items-center gap-2 before:content-['>'] before:text-blue-500/50">${s}</li>`).join('');
                    container.innerHTML += `
                        <div class="cyber-card p-6 rounded">
                            <h3 class="font-mono text-blue-400 text-sm font-bold mb-4 border-b border-slate-800 pb-2"># ${cat.category}</h3>
                            <ul class="space-y-2">${skillList}</ul>
                        </div>
                    `;
                });
            },

            /**
             * renderExperience() : Construit la timeline des expériences professionnelles
             */
            renderExperience() {
                const container = document.getElementById('experience-timeline');
                adminData.experience.forEach(exp => {
                    container.innerHTML += `
                        <div class="relative pl-12 group">
                            <div class="absolute left-[-9px] top-1 w-4 h-4 rounded-full bg-slate-900 border-2 border-slate-700 group-hover:border-blue-500 group-hover:shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all"></div>
                            <div class="cyber-card p-8 rounded">
                                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-4">
                                    <h3 class="text-xl font-bold text-slate-200">${exp.role}</h3>
                                    <span class="font-mono text-xs bg-blue-500/10 text-blue-400 px-3 py-1 rounded border border-blue-500/20">${exp.period}</span>
                                </div>
                                <h4 class="font-mono text-sm text-green-400 mb-4 tracking-tighter uppercase">@ ${exp.company}</h4>
                                <p class="text-slate-400 leading-relaxed text-sm">${exp.details}</p>
                            </div>
                        </div>
                    `;
                });
            },

            /**
             * renderProjects() : Génère les cartes de projets cliquables
             */
            renderProjects() {
                const container = document.getElementById('projects-grid');
                adminData.projects.forEach((proj, idx) => {
                    container.innerHTML += `
                        <div class="cyber-card group overflow-hidden rounded cursor-pointer" onclick="app.openModal(${idx})">
                            <div class="h-48 overflow-hidden relative">
                                <img src="${proj.image}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500">
                                <div class="absolute inset-0 bg-blue-600/10 group-hover:bg-transparent"></div>
                            </div>
                            <div class="p-6 space-y-4">
                                <h3 class="text-lg font-bold text-slate-100 group-hover:text-blue-400 transition-colors">${proj.title}</h3>
                                <p class="text-slate-400 text-sm line-clamp-2">${proj.shortDesc}</p>
                                <div class="flex flex-wrap gap-2">
                                    ${proj.techs.slice(0, 3).map(t => `<span class="text-[10px] font-mono border border-slate-700 px-2 py-0.5 rounded text-slate-500">${t}</span>`).join('')}
                                </div>
                                <div class="pt-4 flex items-center justify-between">
                                    <span class="text-xs font-mono text-blue-500">INIT_DETAILS()</span>
                                    <svg class="w-4 h-4 text-blue-500 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                </div>
                            </div>
                        </div>
                    `;
                });
            },

            /**
             * navigate(viewId) : Système de routage SPA simple
             * @param {string} viewId - Identifiant de la vue à afficher (ex: 'home', 'projects')
             */
            navigate(viewId) {
                // Cache toutes les sections
                document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
                // Affiche la section demandée
                document.getElementById(`view-${viewId}`).classList.remove('hidden');
                // Remonte en haut de page
                window.scrollTo(0, 0);
            },

            /**
             * openModal(idx) : Affiche la fenêtre de détails d'un projet
             * @param {number} idx - Index du projet dans adminData.projects
             */
            openModal(idx) {
                this.currentProjectIndex = idx;
                const proj = adminData.projects[idx];
                const content = document.getElementById('modal-content');
                
                // Injection dynamique du contenu détaillé dans la modale
                content.innerHTML = `
                    <div class="grid lg:grid-cols-2 gap-10">
                        <div class="space-y-6">
                            <h2 class="text-3xl font-bold text-white font-mono">${proj.title}</h2>
                            <p class="text-slate-400 leading-relaxed">${proj.fullDesc}</p>
                            <div class="grid md:grid-cols-2 gap-6 bg-slate-950/50 p-6 rounded border border-slate-800">
                                <div>
                                    <h4 class="text-red-400 font-mono text-xs uppercase mb-2">Challenge</h4>
                                    <p class="text-xs text-slate-500 leading-relaxed">${proj.problem}</p>
                                </div>
                                <div>
                                    <h4 class="text-green-400 font-mono text-xs uppercase mb-2">Technical_Solution</h4>
                                    <p class="text-xs text-slate-500 leading-relaxed">${proj.solution}</p>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-8">
                            <img src="${proj.image}" class="w-full h-64 object-cover rounded border border-slate-800">
                            <div>
                                <h4 class="text-slate-300 font-mono text-xs mb-4 uppercase tracking-widest">Stack_Engine</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${proj.techs.map(t => `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1 rounded text-xs font-mono">${t}</span>`).join('')}
                                </div>
                            </div>
                            <a href="${proj.link}" class="inline-block w-full py-4 bg-slate-800 text-center font-mono text-sm hover:bg-slate-700 transition-all">VIEW_DOCUMENTATION_SRC</a>
                        </div>
                    </div>
                `;
                // Affiche la modale (système de classes Tailwind)
                document.getElementById('project-modal').classList.replace('hidden', 'flex');
                document.body.style.overflow = 'hidden'; // Empêche le défilement du fond
            },

            /**
             * closeModal() : Cache la modale de détails
             */
            closeModal() {
                document.getElementById('project-modal').classList.replace('flex', 'hidden');
                document.body.style.overflow = 'auto'; // Réactive le défilement
            },

            /**
             * navigateModal(dir) : Passe au projet suivant ou précédent dans la modale
             * @param {number} dir - Direction (-1 pour précédent, 1 pour suivant)
             */
            navigateModal(dir) {
                const total = adminData.projects.length;
                // Calcul de l'index avec modulo pour boucler (si après dernier, revient au premier)
                this.currentProjectIndex = (this.currentProjectIndex + dir + total) % total;
                this.openModal(this.currentProjectIndex);
            },

            /**
             * handleForms() : Gère l'envoi factice du formulaire de contact
             */
            handleForms() {
                document.getElementById('contact-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const btn = e.target.querySelector('button');
                    
                    // Feedback visuel de succès70
                    btn.innerText = "SUCCESS_TRANSMITTED";
                    btn.classList.replace('text-blue-400', 'text-green-400');
                    btn.classList.replace('border-blue-500', 'border-green-500');
                    
                    // Réinitialisation après 3 secondes
                    setTimeout(() => {
                        e.target.reset();
                        btn.innerText = "SEND_PACKET";
                        btn.classList.replace('text-green-400', 'text-blue-400');
                        btn.classList.replace('border-green-500', 'border-blue-500');
                    }, 3000);
                });
            }
        };

        // Lancement de l'application quand le document est prêt
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
